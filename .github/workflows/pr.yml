name: PR Check

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - '**'
      - '!main'

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # Base for `nx affected` — test and build fetch full history, so origin/main is always present
  NX_BASE: origin/main
  NX_HEAD: HEAD
  # Nx Cloud remote cache (nxCloudId in nx.json): PRs only read it, with a read-only CI access token (repository
  # secret); fork PRs get no secrets and run without the cache (workspace visible to organization members only).
  # Only main writes.
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_READ_ONLY }}

# Checks run as parallel jobs.
jobs:
  title:
    name: PR Title
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      # PRs are squash-merged with the PR title as the commit message, which Nx Release then parses as a conventional commit on main — so the title must be valid.
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # type checks read the packages' built declarations: after the build job filled the Nx Cloud cache, its own
    # package build is all cache hits
    needs: build

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # type checks resolve workspace packages through their built declarations (dist/*.d.ts); Nx Cloud makes these
      # builds cache hits
      - name: Build packages
        run: yarn build:packages

      - name: Lint
        run: yarn vp check # format, lint and (type-aware) type checks; no --fix, so drift fails CI

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: yarn test:affected

      - name: Coverage Summary
        uses: ./.github/actions/coverage-summary

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != '' }}
        with:
          recreate: true
          path: code-coverage-results.md

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: yarn build:affected
